<!DOCTYPE html>
<html lang="en" data-theme="htb">
<head>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("mcq-theme")||"htb";}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1622">
<title>Exam Review</title>
<script src="banks.js" onerror="window.__noBundle=true"></script>
<style>
  :root, html[data-theme="htb"]{
    --bg:#0e1622; --card:#131f30; --card2:#0f1a28; --line:#26364d;
    --green:#9fef00; --green-dim:#6aa800; --glow:rgba(159,239,0,.22);
    --txt:#b9c4d8; --hi:#f2f6ff; --muted:#6a7a95;
    --red:#ff5b5b; --red-bg:rgba(255,91,91,.12); --amber:#ffbd2e;
  }
  html[data-theme="dark"]{
    --bg:#0b0e14; --card:#161b25; --card2:#11161f; --line:#262d3a;
    --green:#58a6ff; --green-dim:#3d7dc4; --glow:rgba(88,166,255,.22);
    --txt:#c7ccd6; --hi:#f2f6ff; --muted:#7b8496;
    --red:#f87171; --red-bg:rgba(248,113,113,.12); --amber:#d29922;
  }
  html[data-theme="light"]{
    --bg:#e9edf2; --card:#ffffff; --card2:#f3f5f8; --line:#d3dae3;
    --green:#0f766e; --green-dim:#0b5851; --glow:rgba(15,118,110,.15);
    --txt:#334155; --hi:#0e1620; --muted:#5f6b7a;
    --red:#dc2626; --red-bg:rgba(220,38,38,.10); --amber:#b45309;
  }
  html[data-theme="proto"]{
    --bg:#1b1a29; --card:#201f31; --card2:#1b1a29; --line:#3a3850;
    --green:#a779ff; --green-dim:#684fa0; --glow:rgba(167,121,255,.22);
    --txt:#d1d1d3; --hi:#f2f2f5; --muted:#9a98a8;
    --red:#f87171; --red-bg:rgba(248,113,113,.12); --amber:#fbbf24;
  }
  :root{
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"JetBrains Mono","DejaVu Sans Mono","Ubuntu Mono",monospace;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--txt); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column;
    height:100dvh; overflow:hidden;
  }
  .app{width:100%; max-width:560px; margin:0 auto; display:flex; flex-direction:column;
    height:100%; min-height:0}

  /* ---- top bar ---- */
  header{padding:14px 18px 0; flex:none}
  .topbar{display:flex; align-items:center; gap:12px}
  .bank{font-family:var(--mono); font-size:12px; letter-spacing:.04em; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1}
  .bank b{color:var(--green)}
  .score{font-family:var(--mono); font-size:13px; color:var(--hi);
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:5px 12px; flex:none; font-variant-numeric:tabular-nums}
  .score .streak{color:var(--green); margin-left:6px}
  .themebtn{flex:none; width:30px; height:30px; display:grid; place-items:center;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    color:var(--muted); cursor:pointer; transition:color .12s, border-color .12s}
  .themebtn:hover{color:var(--green); border-color:var(--green-dim)}
  .themebtn svg{width:15px; height:15px; fill:none; stroke:currentColor;
    stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; display:none}
  html[data-theme="htb"]   .ic-htb   {display:block}
  html[data-theme="dark"]  .ic-dark  {display:block}
  html[data-theme="light"] .ic-light {display:block}
  html[data-theme="proto"] .ic-proto {display:block}
  .progress{height:4px; background:#1a2739; border-radius:99px; margin:12px 0 0; overflow:hidden}
  .progress > span{display:block; height:100%; width:0; background:var(--green);
    box-shadow:0 0 10px var(--glow); transition:width .35s ease}
  @media (prefers-reduced-motion:reduce){.progress > span{transition:none}}

  /* ---- scroll area ---- */
  main{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:18px 18px 26px}
  .foot{flex:none; text-align:center; color:var(--muted); font-size:10.5px;
    font-family:var(--mono); letter-spacing:.08em; padding:6px 0 calc(8px + var(--safe-b))}

  /* ---- select view ---- */
  h1{font-size:20px; color:var(--hi); margin:2px 0 4px; font-weight:650}
  .sub{color:var(--muted); font-size:13px; margin:0 0 20px}
  .lbl{font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--muted); margin:0 0 8px}
  .selectrow{position:relative; margin-bottom:16px}
  select#course{width:100%; font-family:var(--sans); font-size:16px; color:var(--hi);
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:15px 42px 15px 15px; appearance:none; -webkit-appearance:none}
  select#course:focus{outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--glow)}
  .selectrow::after{content:""; position:absolute; right:18px; top:50%; width:9px; height:9px;
    border-right:2px solid var(--green); border-bottom:2px solid var(--green);
    transform:translateY(-70%) rotate(45deg); pointer-events:none}
  .binfo{background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px 15px; font-size:14px; margin-bottom:20px}
  .binfo .desc{color:var(--txt); margin-bottom:10px; line-height:1.5}
  .binfo .meta{color:var(--muted); font-family:var(--mono); font-size:12px}
  .binfo .meta b{color:var(--green)}
  .topics{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
  .tchip{font-family:var(--mono); font-size:10.5px; color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:3px 9px}

  /* ---- quiz view ---- */
  .qhead{display:flex; align-items:center; gap:10px; margin-bottom:14px}
  .chip{font-family:var(--mono); font-size:11px; letter-spacing:.04em; color:var(--green);
    border:1px solid var(--green-dim); border-radius:999px; padding:4px 11px; background:var(--glow)}
  .qno{font-family:var(--mono); font-size:11px; color:var(--muted); margin-left:auto; letter-spacing:.08em}
  .q{font-size:21px; line-height:1.35; color:var(--hi); margin:0 0 20px; font-weight:600}
  .opts{display:flex; flex-direction:column; gap:11px}
  .opt{display:flex; align-items:center; gap:13px; width:100%; text-align:left;
    font-family:var(--sans); font-size:16px; line-height:1.4; color:var(--txt);
    background:var(--card); border:1.5px solid var(--line); border-radius:13px;
    padding:15px 16px; min-height:58px; cursor:pointer;
    transition:border-color .12s, background .12s, transform .08s}
  .opt:active:not(:disabled){transform:scale(.985)}
  .opt:disabled{cursor:default}
  .opt .ltr{flex:none; width:30px; height:30px; display:grid; place-items:center;
    border:1.5px solid var(--line); border-radius:9px; color:var(--muted);
    font-family:var(--mono); font-size:14px; font-weight:700}
  .opt.correct{border-color:var(--green); background:rgba(159,239,0,.12); color:var(--hi)}
  .opt.correct .ltr{border-color:var(--green); color:var(--green); box-shadow:0 0 12px var(--glow)}
  .opt.wrong{border-color:var(--red); background:var(--red-bg); color:var(--hi)}
  .opt.wrong .ltr{border-color:var(--red); color:var(--red)}
  .opt.dim{opacity:.45}
  .explain{margin-top:16px; border-left:3px solid var(--green); background:var(--card2);
    padding:13px 15px; font-size:14px; line-height:1.55; color:var(--txt);
    border-radius:0 12px 12px 0; display:none}
  .explain.show{display:block}
  .explain .v{font-family:var(--mono); font-weight:700; letter-spacing:.04em; display:block; margin-bottom:5px}
  .explain .v.ok{color:var(--green)} .explain .v.no{color:var(--red)}

  /* card entrance animation */
  .anim{animation:cardin .28s cubic-bezier(.2,.7,.2,1)}
  @keyframes cardin{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){.anim{animation:none}}

  /* ---- bottom action bar (quiz only) ---- */
  .actionbar{flex:none; display:none; gap:10px; align-items:center;
    padding:12px 18px calc(12px + var(--safe-b)); border-top:1px solid var(--line);
    background:linear-gradient(180deg, rgba(14,22,34,0), var(--bg) 22%)}
  body[data-view="quiz"] .actionbar{display:flex}
  .btn{font-family:var(--sans); font-size:15px; font-weight:600; cursor:pointer;
    border-radius:12px; padding:14px 18px; border:1.5px solid var(--line);
    background:var(--card); color:var(--txt); transition:border-color .12s, transform .08s}
  .btn:active{transform:scale(.97)}
  .btn.primary{border-color:var(--green); background:var(--green); color:#0c1621;
    box-shadow:0 0 20px var(--glow)}
  .btn.ghost{color:var(--muted); background:transparent}
  .btn.grow{flex:1}
  .actionbar .spacer{flex:1}

  /* ---- results ---- */
  .rtitle{font-family:var(--mono); color:var(--green); font-size:12px; letter-spacing:.18em; margin-bottom:16px}
  .bigscore{font-size:46px; color:var(--hi); line-height:1; margin-bottom:8px; font-weight:700}
  .bigscore .s{color:var(--muted); font-size:22px; font-weight:600}
  .bigscore .pc{color:var(--green)}
  .verdictline{color:var(--txt); font-size:15px; margin-bottom:24px; line-height:1.5}
  .rt-h{font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--muted); margin:0 0 12px}
  .trow{display:grid; grid-template-columns:1fr auto; gap:7px 12px; align-items:center;
    padding:9px 0; border-bottom:1px solid #1c2b3f; font-size:14px}
  .trow .tn{color:var(--txt)} .trow .tn .flag{color:var(--red); font-size:11px; margin-left:8px; font-family:var(--mono)}
  .trow .tv{color:var(--hi); font-family:var(--mono); font-variant-numeric:tabular-nums}
  .trow .barwrap{grid-column:1/-1; height:5px; background:#1a2739; border-radius:99px; overflow:hidden}
  .trow .barfill{height:100%; background:var(--green)} .trow .barfill.low{background:var(--red)} .trow .barfill.mid{background:var(--amber)}

  .msg{background:var(--card); border:1px solid var(--line); border-left:3px solid var(--amber);
    padding:14px 16px; border-radius:12px; font-size:14px; line-height:1.6}
  .msg code{font-family:var(--mono); background:var(--card2); border:1px solid var(--line);
    border-radius:5px; padding:1px 6px; color:var(--green); font-size:12.5px}
  .startbtn{width:100%; margin-top:4px}
  .hidden{display:none}
</style>
</head>
<body data-view="select">
<div class="app">
  <header>
    <div class="topbar">
      <div class="bank" id="bankName">exam review</div>
      <div class="score" id="scorewrap"><span id="score">0/0</span><span class="streak hidden" id="streak"></span></div>
      <button class="themebtn" id="themeBtn" type="button" title="Switch theme">
        <svg class="ic-htb" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l8.5 4.9v9.2L12 21.5l-8.5-4.9V7.4z"/><path d="M12 2.5v19M3.5 7.4l8.5 4.9 8.5-4.9M12 12.3v9.2"/></svg>
        <svg class="ic-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2z"/></svg>
        <svg class="ic-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>
        <svg class="ic-proto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.1"/><ellipse cx="12" cy="12" rx="9.5" ry="4.2"/><ellipse cx="12" cy="12" rx="9.5" ry="4.2" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9.5" ry="4.2" transform="rotate(120 12 12)"/></svg>
      </button>
    </div>
    <div class="progress"><span id="progFill"></span></div>
  </header>

  <main id="main">
    <!-- SELECT -->
    <section id="select">
      <h1>Flashcard review</h1>
      <p class="sub">Pick a bank and start drilling.</p>
      <div class="lbl">EXAM BANK</div>
      <div class="selectrow"><select id="course"></select></div>
      <div class="binfo" id="binfo"></div>
      <button class="btn primary startbtn" id="btnStart">Start &#9656;</button>
    </section>

    <!-- NO BANKS -->
    <section id="noBanks" class="hidden"><div class="msg" id="noBanksMsg"></div></section>

    <!-- QUIZ -->
    <section id="quiz" class="hidden">
      <div id="card">
        <div class="qhead"><span class="chip" id="chip">TOPIC</span><span class="qno" id="qno">#001</span></div>
        <div class="q" id="qtext">loading...</div>
        <div class="opts" id="opts"></div>
        <div class="explain" id="explain"><span class="v" id="eV"></span><span id="eT"></span></div>
      </div>
    </section>

    <!-- RESULTS -->
    <section id="results" class="hidden">
      <div class="rtitle">SESSION REPORT</div>
      <div class="bigscore"><span id="rCorrect">0</span><span class="s">/<span id="rAtt">0</span></span> &nbsp;<span class="pc" id="rPct">0%</span></div>
      <div class="verdictline" id="rVerdict"></div>
      <div class="rt-h">BY TOPIC</div>
      <div id="rTopics"></div>
      <div style="display:flex; gap:10px; margin-top:24px">
        <button class="btn ghost" id="btnChange">&#9666; Bank</button>
        <button class="btn primary grow" id="btnRestart">Run again</button>
      </div>
    </section>
  </main>

  <!-- QUIZ ACTION BAR -->
  <div class="actionbar" id="actionbar">
    <button class="btn ghost" id="btnQuit">Quit</button>
    <div class="spacer"></div>
    <button class="btn ghost" id="btnSkip">Skip</button>
    <button class="btn primary" id="btnNext" style="display:none">Next &#9656;</button>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
const $=id=>document.getElementById(id);

const THEMES=["htb","dark","light","proto"];
const THEME_NAMES={htb:"HTB",dark:"Dark",light:"Light",proto:"Proto"};
function applyTheme(t){
  if(!THEMES.includes(t)) t="htb";
  document.documentElement.dataset.theme=t;
  const next=THEMES[(THEMES.indexOf(t)+1)%THEMES.length];
  $("themeBtn").title="Switch theme ("+THEME_NAMES[t]+" -> "+THEME_NAMES[next]+")";
  try{localStorage.setItem("mcq-theme",t);}catch(e){}
}
$("themeBtn").addEventListener("click",()=>{
  const cur=document.documentElement.dataset.theme||"htb";
  applyTheme(THEMES[(THEMES.indexOf(cur)+1)%THEMES.length]);
});
applyTheme(document.documentElement.dataset.theme);

function normQ(r){
  const q=r.q||r.question, correct=r.correct||r.answer, d=r.distractors||[];
  const topic=r.topic||"General", explain=r.explain||r.explanation||"";
  if(!q||!correct||!Array.isArray(d)||d.length!==3) return null;
  if(new Set([correct,...d]).size!==4) return null;
  return {topic,q,correct,distractors:d,explain};
}
const normQs=l=>(l||[]).map(normQ).filter(Boolean);

async function discoverBanks(){
  if(window.QUIZ_BANKS && typeof window.QUIZ_BANKS==="object"){
    const idx=[];
    for(const k of Object.keys(window.QUIZ_BANKS)){
      const e=window.QUIZ_BANKS[k];
      const qs=normQs(Array.isArray(e)?e:e.questions); if(!qs.length) continue;
      idx.push({title:e.title||k, description:e.description||"", count:qs.length,
        topics:e.topics||[...new Set(qs.map(q=>q.topic))].sort(), load:async()=>qs});
    }
    if(idx.length){idx.sort((a,b)=>a.title.toLowerCase().localeCompare(b.title.toLowerCase())); return idx;}
  }
  try{
    const r=await fetch("banks/manifest.json",{cache:"no-store"});
    if(r.ok){const m=await r.json(); return m.map(x=>({title:x.title,description:x.description||"",
      count:x.count,topics:x.topics||[],load:async()=>{const rr=await fetch("banks/"+x.file,{cache:"no-store"});
      const d=await rr.json(); return normQs(Array.isArray(d)?d:d.questions);}}));}
  }catch(e){}
  return [];
}

let banks=[], current=null, questions=[];
let deck=[], pos=0, correct=0, attempted=0, streak=0, seen=0, locked=false;
let cur=null, curOpts=[], curCorrectIdx=-1;
const byTopic={};

function setView(v){
  document.body.dataset.view=v;
  for(const s of ["select","quiz","results","noBanks"]) $(s).classList.add("hidden");
  $(v).classList.add("hidden"); $(v).classList.remove("hidden");
  $("main").scrollTop=0;
}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

function renderBankInfo(){
  const b=banks[$("course").selectedIndex]; current=b;
  const chips=b.topics.slice(0,12).map(t=>`<span class="tchip">${t}</span>`).join("");
  const more=b.topics.length>12?`<span class="tchip">+${b.topics.length-12}</span>`:"";
  $("binfo").innerHTML=(b.description?`<div class="desc">${b.description}</div>`:"")+
    `<div class="meta"><b>${b.count}</b> questions &middot; <b>${b.topics.length}</b> topics</div>`+
    `<div class="topics">${chips}${more}</div>`;
}

async function startQuiz(){
  questions=await current.load(); if(!questions.length) return;
  deck=shuffle([...questions.keys()]); pos=0;
  correct=attempted=streak=seen=0; for(const k in byTopic) delete byTopic[k];
  $("bankName").innerHTML="<b>"+current.title+"</b>";
  updateHUD(); setView("quiz"); render();
}

function updateHUD(){
  $("score").textContent=correct+"/"+attempted;
  const st=$("streak");
  if(streak>=2){st.textContent="x"+streak; st.classList.remove("hidden");} else st.classList.add("hidden");
  const total=questions.length||1;
  $("progFill").style.width=Math.min(100,Math.round(100*seen/total))+"%";
}

function render(){
  locked=false;
  if(pos>=deck.length){shuffle(deck); pos=0;}
  cur=questions[deck[pos]];
  const L=["A","B","C","D"];
  curOpts=shuffle([cur.correct,...cur.distractors]);
  curCorrectIdx=curOpts.indexOf(cur.correct);
  $("chip").textContent=cur.topic;
  $("qno").textContent="#"+String(seen+1).padStart(3,"0");
  $("qtext").textContent=cur.q;
  const box=$("opts"); box.innerHTML="";
  curOpts.forEach((opt,i)=>{
    const b=document.createElement("button"); b.className="opt";
    b.innerHTML=`<span class="ltr">${L[i]}</span><span class="otxt"></span>`;
    b.querySelector(".otxt").textContent=opt;
    b.addEventListener("click",()=>answer(i)); box.appendChild(b);
  });
  $("explain").className="explain";
  $("btnNext").style.display="none"; $("btnSkip").style.display="";
  const card=$("card"); card.classList.remove("anim"); void card.offsetWidth; card.classList.add("anim");
  $("main").scrollTop=0;
}

function answer(i){
  if(locked) return; locked=true;
  const ok=i===curCorrectIdx; const L=["A","B","C","D"];
  [...document.querySelectorAll(".opt")].forEach((b,idx)=>{
    b.disabled=true;
    if(idx===curCorrectIdx) b.classList.add("correct");
    else if(idx===i) b.classList.add("wrong"); else b.classList.add("dim");
  });
  attempted++; seen++;
  byTopic[cur.topic]=byTopic[cur.topic]||[0,0]; byTopic[cur.topic][1]++;
  if(ok){correct++; streak++; byTopic[cur.topic][0]++;} else streak=0;
  const v=$("eV"); v.textContent=ok?"[+] CORRECT":"[-] WRONG"; v.className="v "+(ok?"ok":"no");
  $("eT").textContent=(ok?"":"Answer: "+L[curCorrectIdx]+") "+cur.correct+"  -  ")+cur.explain;
  $("explain").classList.add("show");
  $("btnSkip").style.display="none"; $("btnNext").style.display="";
  updateHUD();
}
function nextQ(){pos++; render();}
function skipQ(){if(locked) return; seen++; pos++; render(); updateHUD();}

function quit(){
  const pct=attempted?Math.round(100*correct/attempted):0;
  $("rCorrect").textContent=correct; $("rAtt").textContent=attempted; $("rPct").textContent=pct+"%";
  $("rVerdict").textContent=attempted===0?"No questions answered -- run again when ready."
    :pct>=85?"Strong -- exam-ready on these topics."
    :pct>=70?"Solid -- patch the flagged topics below."
    :"Keep drilling -- start with the flagged topics below.";
  const rows=Object.keys(byTopic).sort((a,b)=>(byTopic[a][0]/byTopic[a][1])-(byTopic[b][0]/byTopic[b][1]));
  const host=$("rTopics"); host.innerHTML="";
  if(!rows.length) host.innerHTML='<div class="trow"><span class="tn" style="color:var(--muted)">-- nothing attempted --</span></div>';
  rows.forEach(t=>{const [c,a]=byTopic[t]; const p=c/a;
    const cls=p<0.6?"low":p<0.85?"mid":""; const flag=p<0.6?'<span class="flag">&#9666; review</span>':"";
    const row=document.createElement("div"); row.className="trow";
    row.innerHTML=`<span class="tn">${t}${flag}</span><span class="tv">${c}/${a}</span>`+
      `<span class="barwrap"><span class="barfill ${cls}" style="width:${Math.round(p*100)}%"></span></span>`;
    host.appendChild(row);});
  setView("results");
}
function changeBank(){setView("select"); $("bankName").textContent="exam review"; $("score").textContent="0/0"; $("streak").classList.add("hidden"); $("progFill").style.width="0%";}

document.addEventListener("keydown",e=>{
  if(document.body.dataset.view==="quiz"){
    const k=e.key.toLowerCase();
    if(k==="q"){quit();return;}
    if(!locked){if(k==="s"){skipQ();return;} const i=["a","b","c","d"].indexOf(k); if(i>=0&&i<curOpts.length) answer(i);}
    else if(k==="enter"||k==="n") nextQ();
  } else if(document.body.dataset.view==="results" && e.key.toLowerCase()==="r") startQuiz();
});
$("btnStart").addEventListener("click",startQuiz);
$("btnSkip").addEventListener("click",skipQ);
$("btnNext").addEventListener("click",nextQ);
$("btnQuit").addEventListener("click",quit);
$("btnRestart").addEventListener("click",startQuiz);
$("btnChange").addEventListener("click",changeBank);
$("course").addEventListener("change",renderBankInfo);

(async function(){
  banks=await discoverBanks();
  if(!banks.length){
    setView("noBanks");
    $("noBanksMsg").innerHTML="No question banks found.<br><br>If you opened this file directly, run "+
      "<code>python3 generate_index.py</code> to build <code>banks.js</code>, then reload.<br><br>"+
      "Or serve the folder: <code>python3 -m http.server</code> and open <code>quiz.html</code>.";
    $("foot").textContent="no banks loaded"; return;
  }
  const sel=$("course");
  banks.forEach((b,i)=>{const o=document.createElement("option"); o.value=i; o.textContent=`${b.title}  (${b.count} Q)`; sel.appendChild(o);});
  sel.selectedIndex=0; renderBankInfo(); setView("select");
  $("foot").textContent=banks.length+" bank(s) loaded";
})();
</script>
</body>
</html>
